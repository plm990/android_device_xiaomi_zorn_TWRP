name: TWRP 16 Builder

on:
  workflow_dispatch:
    inputs:
      TWRP_MANIFEST_URL:
        description: "TWRP manifest url"
        required: true
        default: "https://github.com/TWRP-Test/platform_manifest_twrp_aosp"
      TWRP_MANIFEST_BRANCH:
        description: "TWRP branch"
        required: true
        default: "twrp-16.0"
      DEVICE_TREE_URL:
        description: "Device tree url"
        required: true
        default: "https://github.com/plm990/android_device_xiaomi_zorn_TWRP"
      DEVICE_TREE_BRANCH:
        description: "Device tree branch"
        required: true
        default: "twrp-16.0"
      DEVICE_PATH:
        description: "Device path device/"
        required: true
        default: "xiaomi/zorn"
      DEVICE_NAME:
        description: "Device name"
        required: true
        default: "zorn"
      LUNCH_TARGET:
        description: "lunch twrp_ (default same as device name)"
        required: false
        default: "zorn"
      BUILD_PARTITION:
        description: "Build partition"
        required: true
        default: "recovery"
      BUILD_JOBS:
        description: "Ninja jobs (lower = less RAM)"
        required: true
        default: "4"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
    steps:
    - name: Show build info
      run: |
        echo "LUNCH_TARGET=${{ github.event.inputs.LUNCH_TARGET }}" >> "$GITHUB_ENV"
        echo "BUILD_JOBS=${{ github.event.inputs.BUILD_JOBS }}" >> "$GITHUB_ENV"
        echo "BUILD_DATE=`date +%F`" >> "$GITHUB_ENV"

    - name: Free disk space and setup swap
      run: |
        sudo rm -rf /usr/share/dotnet || true
        sudo rm -rf /usr/local/lib/android || true
        sudo rm -rf /opt/ghc || true
        sudo rm -rf /opt/hostedtoolcache/CodeQL || true
        sudo rm -rf /usr/local/share/boost || true
        sudo apt-get clean
        echo "=== before swap ==="
        df -h /
        free -h
        sudo fallocate -l 16G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        echo "=== after swap ==="
        df -h /
        free -h

    - name: Setup zram
      run: |
        sudo apt install linux-modules-extra-$(uname -r) zram-tools -y || true
        sudo modprobe zram || true
        sudo sed -i 's/^#PERCENT=50/PERCENT=90/' /etc/default/zramswap || true
        sudo sed -i 's/^#PRIORITY=100/PRIORITY=1000/' /etc/default/zramswap || true
        sudo systemctl restart zramswap || true
        zramctl || true
        free -h

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        create-symlink: true

    - name: Setup environment
      run: |
        sudo apt update && sudo apt install repo -y
        git config --global user.name ${{ github.actor }}
        git config --global user.email ${{ github.actor }}@users.noreply.github.com

    - name: Sync source
      run: |
        repo init -u ${{ github.event.inputs.TWRP_MANIFEST_URL }} -b ${{ github.event.inputs.TWRP_MANIFEST_BRANCH }} --depth=1
        repo sync -j4

    - name: Setup device
      run: |
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} device/${{ github.event.inputs.DEVICE_PATH }}

    - name: Build TWRP
      run: |
        free -h
        df -h /
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export USE_CCACHE=1
        export CCACHE_DIR=.ccache
        export CCACHE_EXEC=$(command -v ccache)
        export CCACHE_MAXSIZE=8G
        lunch twrp_${{ env.LUNCH_TARGET }}
        (while true; do echo `date +%T` "Building TWRP..."; free -h; sleep 60; done) &
        TIP_PID=$!
        m -j${{ env.BUILD_JOBS }} ${{ github.event.inputs.BUILD_PARTITION }}image
        mv out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ github.event.inputs.BUILD_PARTITION }}.img \
           out/target/product/${{ github.event.inputs.DEVICE_NAME }}/TWRP-16-zorn-${{ env.BUILD_DATE }}.img
        kill $TIP_PID || true

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: out/target/product/${{ github.event.inputs.DEVICE_NAME }}/TWRP-16-zorn-${{ env.BUILD_DATE }}.img
        name: TWRP-16-zorn-${{ env.BUILD_DATE }}-${{ github.run_id }}
        tag_name: build-${{ env.BUILD_DATE }}-${{ github.run_id }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
